name: nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  pack-cut-full:
    name: pack-cut (git oracle on every cut)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: git identity
        run: git config --global user.name ply && git config --global user.email ply@example.com
      - run: npm ci
      # every ply path already runs every cut on each PR; this adds git index-pack --strict on every cut (~9,600 runs,
      # ~90 s), where the PR run judges field boundaries and every 8th offset (~1,400 runs)
      - name: pack-cut, full oracle
        env:
          PACK_SPACE: full
        run: node --test test/space/pack-cut.test.js

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    env:
      GIT_AUTHOR_NAME: ply
      GIT_AUTHOR_EMAIL: ply@example.com
      GIT_COMMITTER_NAME: ply
      GIT_COMMITTER_EMAIL: ply@example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: git identity
        run: git config --global user.name ply && git config --global user.email ply@example.com
      - run: npm ci
      - run: npm run lint
      - name: unit tests
        run: node --test test/props.test.js test/oracle.test.js test/concurrency.test.js test/edges.test.js test/adversarial.test.js test/compliance.test.js test/parity.test.js test/push.test.js test/push-tree.test.js test/checkout-tree.test.js test/packcache.test.js test/pure.test.js test/bundle.test.js test/prefix-closure.test.js test/format-facts.test.js test/mutant-kill.test.js test/mutant-kill-tree.test.js test/delta-bound.test.js test/git-differential.test.js test/fsck-space.test.js test/fsck-oracle.test.js test/sign.test.js test/merge.test.js test/linemerge.test.js test/rebase.test.js test/sshgit.test.js test/protocol.test.js test/read.test.js test/log.test.js test/artifacts-compat.test.js test/space/push-outcome.test.js test/space/push-outcome-boundary.test.js test/space/fsck-tree.test.js test/space/advertisement.test.js test/wide-limits.test.js test/examples.test.js test/mergebase-space.test.js test/git-bytes.test.js test/span-contract.test.js
      - name: below-hash fuzzer
        run: node test/fuzz/below-hash.mjs --n 20 --seed 1 && node test/fuzz/below-hash.mjs --seed 20261030 --n 100 --case 1730047880
      - name: git-semantic fuzzer
        run: node test/fuzz/git-semantic.mjs --n 20 --seed 1
      - name: liar merge-base fuzzer
        run: node test/fuzz/liar.mjs --op mergebase --n 40 --seed 1

  fuzz:
    # Deterministic fuzz, fixed seeds and sizes, in parallel with `test`, so it adds no PR wall time. The deep,
    # date-seeded runs are in nightly.yml. hostile --case 2366521731 is the pinned case npm test also runs.
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    env:
      GIT_AUTHOR_NAME: ply
      GIT_AUTHOR_EMAIL: ply@example.com
      GIT_COMMITTER_NAME: ply
      GIT_COMMITTER_EMAIL: ply@example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: git identity
        run: git config --global user.name ply && git config --global user.email ply@example.com
      - run: npm ci
      - name: hostile fuzzer
        run: node test/fuzz/hostile.mjs --n 180 --seed 1 && node test/fuzz/hostile.mjs --case 2366521731
      - name: liar fuzzer
        run: node test/fuzz/liar.mjs --n 120 --seed 1
      - name: protocol fuzzer
        run: node test/fuzz/protocol.mjs --n 300 --seed 1
      - name: packs fuzzer
        run: node test/fuzz/packs.mjs --n 36 --seed 1
      - name: codec fuzzer
        run: node test/fuzz/codec.mjs --n 15000 --seed 1
      - name: attributes fuzzer
        run: node test/fuzz/attributes.mjs --n 120 --seed 1

  # Stryker over the src files a PR changed (all of src/ on main), split into 8 shards balanced by mutant count
  # (scripts/mutate.mjs --plan 8). A file is the unit, and linemerge.js alone is 13% of src/, so 8 is where more
  # shards stop shortening a full run. Shards only run Stryker; the job named `mutate` merges their reports and
  # judges them with the same rules as an unsharded run. The 8 appears here three times; the merge refuses a
  # missing or extra shard, so changing one and not the others fails the gate.
  mutate-shard:
    name: mutate-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stryker
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MUTATE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/mutate.mjs --shard "${SHARD}/8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  # The gate. Its name stays `mutate` so anything waiting on that check still works. It runs even when a shard
  # fails or is cancelled (a skipped required check would count as passing), and fails unless every shard succeeded.
  mutate:
    name: mutate
    needs: mutate-shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    steps:
      - name: every shard succeeded
        env:
          SHARDS: ${{ needs.mutate-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "mutate-shard result: $SHARDS"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-shard-*
          path: shard-reports
      - name: merge and judge
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MUTATE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/mutate.mjs --merge shard-reports --shards 8
      # The merged report, for per-file history (weights for a future partition, or a look at what survived).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() || failure()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 14

  supply-chain:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          version: "1.31.1"
          online-audits: false
          advanced-security: false
          persona: regular

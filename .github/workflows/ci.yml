name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ply
      GIT_AUTHOR_EMAIL: ply@example.com
      GIT_COMMITTER_NAME: ply
      GIT_COMMITTER_EMAIL: ply@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: git identity
        run: git config --global user.name ply && git config --global user.email ply@example.com
      - run: npm ci
      - run: npm run lint
      - name: unit tests
        run: node --test test/props.test.js test/oracle.test.js test/concurrency.test.js test/edges.test.js test/adversarial.test.js test/compliance.test.js test/parity.test.js test/push.test.js test/packcache.test.js test/pure.test.js test/bundle.test.js test/prefix-closure.test.js test/format-facts.test.js test/mutant-kill.test.js test/sign.test.js test/merge.test.js test/linemerge.test.js test/rebase.test.js test/sshgit.test.js test/protocol.test.js test/read.test.js test/artifacts-compat.test.js
      - name: below-hash fuzzer
        run: node test/fuzz/below-hash.mjs --n 20 --seed 1

  mutate:
    name: mutate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stryker
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MUTATE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/mutate.mjs

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    env:
      GIT_AUTHOR_NAME: ply
      GIT_AUTHOR_EMAIL: ply@example.com
      GIT_COMMITTER_NAME: ply
      GIT_COMMITTER_EMAIL: ply@example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: git identity
        run: git config --global user.name ply && git config --global user.email ply@example.com
      - run: npm ci
      - run: npm run lint
      - name: unit tests
        run: node --test test/props.test.js test/oracle.test.js test/concurrency.test.js test/edges.test.js test/adversarial.test.js test/compliance.test.js test/parity.test.js test/push.test.js test/push-tree.test.js test/checkout-tree.test.js test/packcache.test.js test/pure.test.js test/bundle.test.js test/prefix-closure.test.js test/format-facts.test.js test/mutant-kill.test.js test/mutant-kill-tree.test.js test/delta-bound.test.js test/git-differential.test.js test/sign.test.js test/merge.test.js test/linemerge.test.js test/rebase.test.js test/sshgit.test.js test/protocol.test.js test/read.test.js test/artifacts-compat.test.js test/wide-limits.test.js
      - name: below-hash fuzzer
        run: node test/fuzz/below-hash.mjs --n 20 --seed 1
      - name: git-semantic fuzzer
        run: node test/fuzz/git-semantic.mjs --n 20 --seed 1

  mutate:
    name: mutate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node persists the npm cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stryker
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MUTATE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/mutate.mjs

  supply-chain:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          version: "1.31.1"
          online-audits: false
          advanced-security: false
          persona: regular
